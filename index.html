  <body>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: hsl(145, 20%, 98%);
        color: hsl(155, 40%, 12%);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 300ms ease;
      }
      #boot-loader.fade-out { opacity: 0; pointer-events: none; }
      #boot-loader .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid hsl(158, 75%, 24%, 0.2);
        border-top-color: hsl(158, 75%, 24%);
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loader .label {
        font-size: 13px;
        font-weight: 500;
        color: hsl(155, 10%, 35%);
        letter-spacing: 0.02em;
      }
      #boot-loader .brand {
        font-size: 14px;
        font-weight: 700;
        color: hsl(158, 75%, 24%);
        letter-spacing: 0.04em;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #boot-loader { background: hsl(160, 25%, 6%); color: hsl(150, 15%, 94%); }
      }
    </style>
    <div id="root"></div>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="brand">BPF_Consult</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="label">Carregando aplicação...</div>
    </div>
    <script>
      // Auto-fail-safe: se o app não montar em 15s, mostra fallback e marca erro crítico
      window.__BOOT_T0__ = Date.now();
      window.__BOOT_FAILSAFE__ = setTimeout(function () {
        var loader = document.getElementById('boot-loader');
        if (!loader) return;
        var root = document.getElementById('root');
        if (root && root.children.length > 0) return; // app montou
        
        try {
          var elapsed = Date.now() - (window.__BOOT_T0__ || Date.now());
          var pending = JSON.parse(localStorage.getItem('__pending_boot_errors__') || '[]');
          
          // Marca que houve um erro crítico de boot para forçar limpeza de cache no próximo reload
          localStorage.setItem('__boot_critical_error__', 'true');
          
          pending.push({
            type: 'boot_failsafe',
            message: 'App did not mount within 15s',
            elapsedMs: elapsed,
            route: window.location.pathname + window.location.search,
            userAgent: navigator.userAgent,
            timestamp: new Date().toISOString(),
          });
          localStorage.setItem('__pending_boot_errors__', JSON.stringify(pending.slice(-10)));
          console.error('[BootFailsafe] App did not mount within 15s', { elapsedMs: elapsed });
        } catch (e) {}

        loader.innerHTML =
          '<div style="max-width:420px;text-align:center;padding:24px;background:white;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1)">' +
          '<div style="font-size:40px;margin-bottom:16px">🚀</div>' +
          '<h2 style="font-size:20px;margin:0 0 12px;font-weight:700;color:#1a1a2e">Otimizando sua conexão</h2>' +
          '<p style="font-size:14px;color:#4b5563;margin:0 0 24px;line-height:1.6">Detectamos uma demora no carregamento. Clique abaixo para forçar uma limpeza de cache e carregar a versão mais recente.</p>' +
          '<button onclick="localStorage.removeItem(\'__app_version__\');window.location.reload(true)" style="background:#15803d;color:white;border:none;padding:12px 24px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)">Recarregar Agora</button>' +
          '</div>';
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
